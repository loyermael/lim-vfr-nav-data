# Tâche planifiée du DÉPÔT DE DONNÉES (code de l'appli : autre dépôt).
# Chaque heure : reconstruit le paquet (météo à chaque fois ; espaces et terrains seulement s'ils ont plus de 20 h), puis publie
# sur GitHub Pages (gratuit, avec les en-têtes CORS que l'appli exige).
# Une fois par cycle AIRAC (28 jours) : reconstruit aussi l'INDEX DES VAC (calage automatique de chaque carte du SIA, par empreinte
# du PDF). Les PDF eux-mêmes (SIA, licence ouverte : source et date indiquées, sans altération) sont publiés sur la branche vac-data,
# servie avec CORS par raw.githubusercontent.com ; l'index (sur Pages) indique où les télécharger.
name: publier-donnees
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reprendre le paquet publié (pour ne pas re-télécharger ce qui est encore récent)
        env:
          PAGES_URL: ${{ vars.PAGES_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          mkdir -p prev/vac
          if [ -n "$PAGES_URL" ] && curl -sf "$PAGES_URL/manifest.json" -o prev/manifest.json; then
            jq -r '.countries[].datasets[].files[].path' prev/manifest.json | while read -r p; do
              mkdir -p "prev/$(dirname "$p")"
              curl -sf "$PAGES_URL/$p" -o "prev/$p" || echo "absent : $p"
            done
          fi
          curl -sf "$PAGES_URL/vac/index.json" -o prev/vac/index.json || rm -f prev/vac/index.json
      - name: Dépendance Python des obstacles (lecture du fichier Excel du SIA)
        run: pip install --quiet openpyxl
      - name: Construire le paquet
        run: node tools/build-data-pack.mjs --out pack --prev prev
      - name: Index des VAC (une fois par cycle AIRAC)
        continue-on-error: true
        run: |
          pip install --quiet pymupdf fonttools
          CYCLE=$(python tools/build-vac-index.py --print-cycle)
          mkdir -p pack/vac
          if [ -f prev/vac/index.json ] && grep -q "\"cycle\": \"$CYCLE\"" prev/vac/index.json; then
            cp prev/vac/index.json pack/vac/index.json
            echo "index des VAC déjà à jour pour le cycle $CYCLE"
          else
            python tools/build-vac-index.py --out pack/vac --cycle auto --icao-from pack/fr/airfields/fr_apt.json --delay 0.7 --pdf-dir vac-pdf --files-base "https://raw.githubusercontent.com/${{ github.repository }}/vac-data"
          fi
      - name: Publier les PDF des VAC (branche vac-data, une fois par cycle)
        if: hashFiles('vac-pdf/*.pdf') != ''
        continue-on-error: true
        run: |
          cd vac-pdf
          CYCLE=$(python ../tools/build-vac-index.py --print-cycle)
          echo "VAC : Service de l Information Aeronautique (SIA), licence ouverte. Fichiers non modifies, cycle AIRAC $CYCLE." > SOURCE.txt
          echo "Source : https://www.sia.aviation-civile.gouv.fr/" >> SOURCE.txt
          cp ../pack/vac/index.json index.json
          git init -q -b vac-data
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "VAC SIA, cycle $CYCLE"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vac-data
      - name: Garder l'ancien index si la reconstruction a échoué
        run: |
          if [ ! -f pack/vac/index.json ] && [ -f prev/vac/index.json ]; then mkdir -p pack/vac && cp prev/vac/index.json pack/vac/index.json; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pack
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
